services:
  hub-proxy:
    build:
      context: ./infra/nginx
    depends_on:
      hub-backend:
        condition: service_healthy
      hub-frontend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
    user: "101:101"
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - hub-operacional-net

  hub-backend:
    build:
      context: ./backend
    env_file:
      - .env
      - .env.runtime.local
    environment:
      - TZ=America/Sao_Paulo
      - LOCAL_STATE_DB_PATH=/app/data/local_state.db
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:18081:8080"
    expose:
      - "8080"
    volumes:
      - hub_backend_state:/app/data
    networks:
      - hub-operacional-net

  hub-frontend:
    build:
      context: ./web
      args:
        INTERNAL_API_URL: http://hub-backend:8080
    environment:
      - HOST=0.0.0.0
      - INTERNAL_API_URL=http://hub-backend:8080
      - NEXT_PUBLIC_DTIC_AGENT_URL=http://localhost:8501
    restart: unless-stopped
    depends_on:
      hub-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - "127.0.0.1:18082:3000"
    init: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    networks:
      - hub-operacional-net

networks:
  hub-operacional-net:
    driver: bridge

volumes:
  hub_backend_state:
